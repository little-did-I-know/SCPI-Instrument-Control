name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1 flake8

      - name: Check code formatting with Black
        run: |
          black --check --line-length 200 scpi_control/ examples/

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 scpi_control/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 scpi_control/ --count --exit-zero --max-line-length=200 --statistics

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        # npm install, not npm ci: the lockfile is generated on Windows and
        # omits Linux-only optional dep nodes (@emnapi/*, WASM fallbacks), which
        # makes strict `npm ci` fail on the Linux runner. `npm install` respects
        # the lockfile and adds the platform's missing optional nodes.
        run: npm install --no-audit --no-fund
        working-directory: webapp/app

      - name: Unit tests
        run: npm test
        working-directory: webapp/app

      - name: Typecheck and build
        run: npm run build
        working-directory: webapp/app

      - name: Build the admin bundle
        run: npm run build:admin
        working-directory: webapp/app

      - name: The LAN bundle must not contain admin code
        # The admin panel is served only on a loopback-bound listener and has no
        # authentication. If admin code reaches the LAN bundle, every browser in
        # the lab is served the UI for administering access.
        #
        # Vite's default single entry means admin.html cannot be swept in by
        # accident, so this guards the deliberate case: an import from
        # src/admin/* into the main app's module graph. That leaves the
        # filenames untouched and only shows up inside the emitted chunks, which
        # is why this greps content rather than listing files.
        #
        # "/api/identities" is an admin-only route string; it is a plain string
        # literal in src/admin/api.ts and esbuild's minifier leaves it intact
        # (verified against both built bundles).
        run: |
          # Assert the haystacks exist first. A missing dist/ would make grep
          # exit 2, which the `if` below reads as "no match" -- so the negative
          # assertion would pass without having looked at anything.
          test -f dist/index.html
          test -f dist-admin/admin.html
          if grep -rl "/api/identities" dist/; then
            echo "::error::admin code reached the LAN bundle — see webapp/app/vite.admin.config.ts"
            exit 1
          fi
          # And prove the needle is still findable, so a rename of the route
          # cannot turn this gate into one that silently always passes.
          grep -rq "/api/identities" dist-admin/ || {
            echo "::error::'/api/identities' is not in the admin bundle — this check no longer proves anything; update the search string"
            exit 1
          }
          echo "LAN bundle clean; admin bundle built"
        working-directory: webapp/app

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  test-install:
    name: Test Installation (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install package from wheel (cross-platform)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          python - <<'PY'
          import glob, os, subprocess, sys
          wheels = sorted(glob.glob(os.path.join("dist", "**", "*.whl"), recursive=True))
          if not wheels:
              contents = []
              if os.path.isdir("dist"):
                  for root, _, files in os.walk("dist"):
                      for f in files:
                          contents.append(os.path.relpath(os.path.join(root, f), "dist"))
              else:
                  contents = "dist/ missing"
              print(f"ERROR: No wheel found under dist/. Contents: {contents}")
              sys.exit(1)
          wheel = wheels[0]
          print("Installing wheel:", wheel)
          subprocess.check_call([sys.executable, "-m", "pip", "install", wheel])
          PY

      - name: Test import
        run: |
          python -c "from scpi_control import Oscilloscope; print('Import successful')"
          python -c "import scpi_control; print('Version:', scpi_control.__version__)"

      - name: Test CLI command availability
        run: |
          python -m pip show SCPI-Instrument-Control
          which siglent-gui || where siglent-gui || echo "CLI command check"

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,uncertainty]" httpx "ollama>=0.6.0"  # httpx: fastapi.testclient; ollama: LLM tool-calling schema tests; uncertainty: pint/uncertainties for measurement-uncertainty tests
          pip install pytest pytest-cov pytest-xdist pytest-timeout  # pytest-timeout: tests/test_server_stream_ws.py is marked, and --strict-markers errors without the plugin

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=scpi_control --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          # `files` (plural). codecov-action v4+ dropped `file`, and passing it only
          # produces a warning -- the step still goes green while the path is ignored
          # and the CLI falls back to searching the tree for a report.
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -e .
          safety check || echo "Safety check completed"

      - name: Run security linter (Bandit)
        run: |
          bandit -r scpi_control/ -ll || echo "Bandit scan completed"

  publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, test-install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/SCPI-Instrument-Control/

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: false
