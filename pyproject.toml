[build-system]
# setuptools>=77 is required for the PEP 639 `license`/`license-files` fields below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SCPI-Instrument-Control"
version = "5.3.0"
# NOTE: this is the PyPI summary and has a hard 512-character cap. Check the length
# before every release -- the v3.2.0 publish failed on exactly this.
description = "Universal Python library for SCPI test equipment over Ethernet, USB, GPIB or serial. One API for oscilloscopes (Siglent, Tektronix, LeCroy), AWGs, power supplies and DAQ units, with waveform capture and provenance, FFT analysis, a PyQt6 GUI, a browser lab gateway, PDF/Markdown reports with local-LLM analysis, and high-fidelity mock instruments for developing with no hardware attached."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["SCPI", "instrument control", "test equipment", "test automation", "lab automation", "laboratory", "lab equipment", "measurement", "data acquisition", "DAQ", "oscilloscope", "function generator", "signal generator", "AWG", "arbitrary waveform generator", "power supply", "PSU", "waveform", "IEEE 488.2", "VISA", "GPIB", "siglent", "tektronix", "lecroy", "SDS", "SDG", "SPD", "FFT", "protocol decoder", "mock instruments"]
authors = [
    {name = "Robin Mumm"}
]
maintainers = [
    {name = "little-did-I-know"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Environment :: X11 Applications :: Qt",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/little-did-I-know/SCPI-Instrument-Control"
Documentation = "https://little-did-I-know.github.io/SCPI-Instrument-Control/"
Repository = "https://github.com/little-did-I-know/SCPI-Instrument-Control"
Issues = "https://github.com/little-did-I-know/SCPI-Instrument-Control/issues"
Changelog = "https://github.com/little-did-I-know/SCPI-Instrument-Control/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0.0",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.5",
    "codecov>=2.1.0",
    "black>=26.5,<27; python_version >= '3.10'",
    "flake8>=6.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
hdf5 = [
    "h5py>=3.8.0",
]
gui = [
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "pyqtgraph>=0.13.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "Pillow>=10.0",
]
fun = [
    "shapely>=2.0.0",
    "Pillow>=10.0.0",
    "svgpathtools>=1.6.0",
]
report-generator = [
    "PyQt6>=6.6.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "svglib>=1.5.0",
    "ollama>=0.6.0",
    "PyMuPDF>=1.23.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
]
# Experimental features (BETA - v0.4.0-beta.1)
# Power supply control - no additional dependencies required
# Included for explicit feature installation and documentation
power-supply-beta = []
# USB/VISA support for instruments (power supplies, oscilloscopes)
# Enables USB, GPIB, and Serial connections via PyVISA
usb = [
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.7.0",  # Pure Python backend, no NI-VISA required
]
experimental = [
    # Future experimental features will be added here
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
]
build-exe = [
    "pyinstaller>=6.0.0",
]
all = [
    "h5py>=3.8.0",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "pyqtgraph>=0.13.0",
    "shapely>=2.0.0",
    "Pillow>=10.0.0",
    "svgpathtools>=1.6.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "svglib>=1.5.0",
    "ollama>=0.6.0",
    "PyMuPDF>=1.23.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    # Note: Experimental features not included in 'all'
    # Install explicitly with [power-supply-beta] or [experimental]
]

[project.scripts]
siglent-gui = "scpi_control.gui.app:main"
siglent-report-generator = "scpi_control.report_generator.app:main"
scpi-web = "scpi_control.server.__main__:main"
scpi-extract = "scpi_control.scpi_extract:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
scpi_control = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scpi_control*"]

[tool.black]
line-length = 200
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "hardware: tests that require actual oscilloscope hardware",
    "gui: tests that require GUI dependencies (PyQt6)",
    "slow: tests that run examples as subprocesses (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["scpi_control"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/examples/*",
    "*/scripts/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
