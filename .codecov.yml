# Codecov configuration for Siglent-Oscilloscope
# Documentation: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 5%
        informational: false

  ignore:
    - "tests/"
    - "scripts/"
    - "examples/"
    - "docs/"
    - "**/__pycache__"
    - "**/*.pyc"
    - "**/test_*.py"
    # The desktop GUI cannot execute in CI at all: the test job installs
    # `.[dev,web]`, which excludes PyQt6 (it lives in the `gui` extra), and the
    # runner has no display for a Qt event loop. Counting these lines measures
    # the CI environment rather than the code, and drags the reported figure
    # down by ~8 points without telling anyone anything actionable.
    #
    # This is an exclusion, NOT a claim that the GUI is tested -- it is not.
    # If the GUI ever gains CI coverage (an offscreen Qt platform plugin plus
    # the `gui` extra installed), delete this entry rather than leaving a
    # tested subsystem invisible.
    - "scpi_control/gui/"

comment:
  layout: "reach,diff,flags,tree,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true
